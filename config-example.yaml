# DEEJ Konfigurationsdatei für Audiomixpult
# Speichere diese Datei als "config.yaml" im DEEJ-Verzeichnis

# Slider Mapping: Ordne jedem Regler (0-4) eine Anwendung zu
slider_mapping:
  # Slider 0 (Erster Regler von links)
  0: master
  
  # Slider 1 
  1: discord.exe
  
  # Slider 2
  2: spotify.exe
  
  # Slider 3
  3: chrome.exe
  
  # Slider 4
  4: deej.unmapped

# WICHTIG: COM-Port des Arduino Nano
# Finde den Port im Gerätemanager (Windows) unter "Anschlüsse (COM & LPT)"
# Oder in der Arduino IDE unter Tools -> Port
com_port: COM3

# Baudrate - muss mit BAUD_RATE im Arduino-Sketch übereinstimmen (Standard: 9600)
baud_rate: 9600

# Alle Regler umkehren (true = oben ist 0 %, unten ist 100 %)
# Gilt für ALLE Regler. Einzelne Regler werden im Arduino-Sketch über das
# Array INVERT[] umgekehrt (dort sind aktuell alle fünf Regler umgekehrt).
invert_sliders: false

# Noise Reduction - ignoriert kleine Wertänderungen
# Erlaubte Werte: low (sehr gute Hardware), default, high (zittrige Regler)
noise_reduction: default

# ============================================
# HÄUFIGE ANWENDUNGEN (Prozessnamen)
# ============================================
# 
# Kommunikation:
#   - discord.exe
#   - teamspeak3.exe
#   - skype.exe
#   - zoom.exe
#   - slack.exe
#
# Musik & Media:
#   - spotify.exe
#   - vlc.exe
#   - wmplayer.exe (Windows Media Player)
#   - foobar2000.exe
#
# Browser:
#   - chrome.exe
#   - firefox.exe
#   - msedge.exe (Microsoft Edge)
#   - opera.exe
#
# Gaming:
#   - csgo.exe
#   - League of Legends.exe
#   - Overwatch.exe
#   - minecraft.exe
#
# Streaming:
#   - obs64.exe (OBS Studio)
#   - streamlabs obs.exe
#
# System:
#   - master (Gesamt-Systemlautstärke)
#   - mic (Mikrofon)
#   - system (System-Sounds)
#   - deej.unmapped (Nicht zugeordnet)
#
# ============================================
# ERWEITERTE BEISPIELE
# ============================================

# Beispiel 1: Gaming-Setup
# slider_mapping:
#   0: master
#   1: discord.exe
#   2: spotify.exe
#   3: csgo.exe
#   4: chrome.exe

# Beispiel 2: Streaming-Setup
# slider_mapping:
#   0: master
#   1: obs64.exe
#   2: discord.exe
#   3: spotify.exe
#   4: chrome.exe

# Beispiel 3: Office/Homeoffice-Setup
# slider_mapping:
#   0: master
#   1: zoom.exe
#   2: slack.exe
#   3: spotify.exe
#   4: chrome.exe

# Beispiel 4: Mikrofon-Kontrolle
# slider_mapping:
#   0: master
#   1: mic
#   2: discord.exe
#   3: spotify.exe
#   4: chrome.exe

# ============================================
# TIPPS
# ============================================
#
# 1. Prozessnamen finden:
#    - Windows: Task-Manager öffnen (Strg+Shift+Esc)
#    - Tab "Details" öffnen
#    - Prozessname in der Spalte "Name" ablesen
#
# 2. Mehrere Anwendungen einem Regler zuordnen:
#    slider_mapping:
#      0: [chrome.exe, firefox.exe, msedge.exe]
#
# 3. Geräte steuern (z.B. Lautsprecher):
#    slider_mapping:
#      0: ["Lautsprecher (Realtek High Definition Audio)"]
#    
#    Exakter Gerätename aus Windows Sound-Einstellungen
#
# 4. Session-Gruppen:
#    slider_mapping:
#      0: master
#      1: 
#        - discord.exe
#        - teamspeak3.exe
#      2: spotify.exe
#
# 5. Debug-Ausgabe aktivieren (für Fehlersuche):
#    deej im Terminal starten:  deej.exe --verbose
#    (zeigt u.a. jede empfangene Zeile und erkannte Reglerbewegungen)
#
# ============================================
# TROUBLESHOOTING
# ============================================
#
# Problem: Anwendung wird nicht gefunden
# Lösung: 
#   - Prozessname mit .exe-Endung schreiben (z.B. discord.exe, nicht discord)
#   - Groß-/Kleinschreibung ist egal
#   - Anwendung muss Audio abspielen
#
# Problem: Regler zittert/springt
# Lösung:
#   - noise_reduction auf high setzen
#   - NUM_READINGS bzw. SNAP_MARGIN im Arduino-Sketch erhöhen
#
# Problem: COM-Port nicht gefunden
# Lösung:
#   - Arduino anschließen
#   - Gerätemanager öffnen
#   - COM-Port unter "Anschlüsse" ablesen
#   - com_port: entsprechend anpassen
